name: PHP Quality

on:
  pull_request:
  push:
    branches:
      - main
      - codex/phase-2-0-4b-revocation

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Validate Composer files
        # Runtime versions are deliberately exact-pinned by the OAuth/JWT
        # compatibility contract; schema and lock consistency remain checked.
        run: composer validate --strict --no-check-all

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit tests
        run: composer test

      - name: Run WordPress Coding Standards
        run: composer lint

      - name: Audit locked dependencies
        run: composer audit --locked
